<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Notes</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>Notes</span>
        <button id="newNoteBtn" title="New note">+</button>
      </div>
      <ul id="noteList" class="note-list"></ul>
    </aside>

    <main class="editor">
      <textarea id="content" class="content-area" placeholder="Start writing..."></textarea>
      <div class="tags-bar">
        <input id="tagsInput" class="tags-input" placeholder="tags, comma, separated" />
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
